    delete: { tags: [tenant], summary: Soft-delete tenant, parameters: [{$ref: '#/components/parameters/Id'}], responses: {204: {description: Deleted}, 404: {$ref: '#/components/responses/NotFound'}, 409: {$ref: '#/components/responses/Conflict'}} }

