    patch: { tags: [booking], summary: Update basic booking fields (status immutable this phase), parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/BookingUpdate'}}}}, responses: {200: {$ref: '#/components/responses/Booking'}, 409: {description: Room overlap conflict}, 422: {$ref: '#/components/responses/ValidationError'}} }
    delete: { tags: [booking], summary: Soft-delete booking, parameters: [{$ref: '#/components/parameters/Id'}], responses: {204: {description: Deleted}} }
  /service-bookings:
    get: { tags: [booking], summary: List service bookings, parameters: [{$ref: '#/components/parameters/BookingIdOptional'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}], responses: {200: {$ref: '#/components/responses/ServiceBookingPage'}} }
    post: { tags: [booking], summary: Create service booking (idempotency-backed), parameters: [{$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ServiceBookingInput'}}}}, responses: {201: {$ref: '#/components/responses/ServiceBooking'}, 409: {description: Overlap or idempotency conflict}, 422: {$ref: '#/components/responses/ValidationError'}} }
  /service-bookings/{id}:
    get: { tags: [booking], summary: Get service booking, parameters: [{$ref: '#/components/parameters/Id'}], responses: {200: {$ref: '#/components/responses/ServiceBooking'}, 404: {$ref: '#/components/responses/NotFound'}} }
    patch: { tags: [booking], summary: Update service booking status/basic fields, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ServiceBookingUpdate'}}}}, responses: {200: {$ref: '#/components/responses/ServiceBooking'}, 422: {$ref: '#/components/responses/ValidationError'}} }
    delete: { tags: [booking], summary: Soft-delete service booking, parameters: [{$ref: '#/components/parameters/Id'}], responses: {204: {description: Deleted}} }

  /bookings/{bookingId}/guests:
    get: { tags: [guest], summary: List guests of booking, parameters: [{$ref: '#/components/parameters/BookingId'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}], responses: {200: {$ref: '#/components/responses/GuestPage'}} }
    post: { tags: [guest], summary: Create guest (document received as opaque ciphertext), parameters: [{$ref: '#/components/parameters/BookingId'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/GuestInput'}}}}, responses: {201: {$ref: '#/components/responses/Guest'}, 422: {$ref: '#/components/responses/ValidationError'}} }
  /guests/{id}:
    get: { tags: [guest], summary: 'Get guest (no ciphertext, no document content)', parameters: [{$ref: '#/components/parameters/Id'}], responses: {200: {$ref: '#/components/responses/Guest'}, 404: {$ref: '#/components/responses/NotFound'}} }
    patch: { tags: [guest], summary: Update guest basic fields, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/GuestUpdate'}}}}, responses: {200: {$ref: '#/components/responses/Guest'}} }
    delete: { tags: [guest], summary: Soft-delete guest, parameters: [{$ref: '#/components/parameters/Id'}], responses: {204: {description: Deleted}} }
  /bookings/{bookingId}/boarding-passes:
    get: { tags: [guest], summary: List boarding passes of booking, parameters: [{$ref: '#/components/parameters/BookingId'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}], responses: {200: {$ref: '#/components/responses/BoardingPassPage'}} }
    post: { tags: [guest], summary: Issue boarding pass, parameters: [{$ref: '#/components/parameters/BookingId'}], responses: {201: {$ref: '#/components/responses/BoardingPass'}, 422: {$ref: '#/components/responses/ValidationError'}} }
  /boarding-passes/{id}:
    get: { tags: [guest], summary: Get boarding pass, parameters: [{$ref: '#/components/parameters/Id'}], responses: {200: {$ref: '#/components/responses/BoardingPass'}, 404: {$ref: '#/components/responses/NotFound'}} }
    post: { tags: [guest], summary: Revoke boarding pass (sets revoked_at), parameters: [{$ref: '#/components/parameters/Id'}], responses: {200: {$ref: '#/components/responses/BoardingPass'}, 404: {$ref: '#/components/responses/NotFound'}} }
components:
  securitySchemes:
    principal: { type: http, scheme: bearer, bearerFormat: opaque-token-or-dev-principal, description: 'Default-deny; dev principal provider only for non-production configuration.' }
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    ShipId: {name: shipId, in: path, required: true, schema: {type: string, format: uuid}}
    VoyageId: {name: voyageId, in: path, required: true, schema: {type: string, format: uuid}}
    BookingId: {name: bookingId, in: path, required: true, schema: {type: string, format: uuid}}
    PartnerId: {name: partnerId, in: path, required: true, schema: {type: string, format: uuid}}
    StaffId: {name: staffId, in: path, required: true, schema: {type: string, format: uuid}}
    ShipIdQueryOptional: {name: shipId, in: query, required: false, schema: {type: string, format: uuid}}
    VoyageIdOptional: {name: voyageId, in: query, required: false, schema: {type: string, format: uuid}}
    BookingIdOptional: {name: bookingId, in: query, required: false, schema: {type: string, format: uuid}}
    Limit: {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    Cursor: {name: cursor, in: query, required: false, schema: {type: string, maxLength: 256}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: false, schema: {type: string, maxLength: 128}}
  schemas:
    Error:
      type: object
      properties:
        error: {type: object, properties: {code: {type: string, example: validation_failed}, message: {type: string}, request_id: {type: string}}, required: [code, message]}
    CollectionMeta:
      type: object
      properties: {next_cursor: {type: string, nullable: true}}
    TenantInput: {type: object, required: [name], properties: {name: {type: string, maxLength: 255}}}
    TenantUpdate: {type: object, properties: {name: {type: string, maxLength: 255}}}
    Tenant: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}, version: {type: integer}}}
    ShipInput: {type: object, required: [name], properties: {name: {type: string}, imo_number: {type: string, nullable: true}, flag_state: {type: string, nullable: true}, timezone: {type: string, default: UTC}}}
    ShipUpdate: {type: object, properties: {name: {type: string}, flag_state: {type: string, nullable: true}, timezone: {type: string}, status: {type: string, enum: [active, maintenance, retired]}}}
    Ship: {type: object, properties: {id: {type: string, format: uuid}, name: {type: string}, imo_number: {type: string, nullable: true}, flag_state: {type: string, nullable: true}, timezone: {type: string}, status: {type: string, enum: [active, maintenance, retired]}}}
    DeckInput: {type: object, required: [level, name], properties: {level: {type: integer}, name: {type: string}}}
    DeckUpdate: {type: object, properties: {name: {type: string}}}
    Deck: {type: object, properties: {id: {type: string, format: uuid}, ship_id: {type: string, format: uuid}, level: {type: integer}, name: {type: string}}}
    AreaInput: {type: object, required: [deck_id, name, area_type], properties: {deck_id: {type: string, format: uuid}, name: {type: string}, area_type: {type: string, enum: [restaurant, lobby, open_deck, theatre, shop, corridor, stairwell, spa, pool, other]}, capacity: {type: integer, nullable: true}, layout: {type: object, additionalProperties: true, nullable: true}}}
    AreaUpdate: {type: object, properties: {name: {type: string}, capacity: {type: integer, nullable: true}, layout: {type: object, additionalProperties: true, nullable: true}}}
    Area: {type: object, properties: {id: {type: string, format: uuid}, ship_id: {type: string, format: uuid}, deck_id: {type: string, format: uuid}, name: {type: string}, area_type: {type: string}, capacity: {type: integer, nullable: true}, layout: {type: object, additionalProperties: true, nullable: true}}}
    RoomInput: {type: object, required: [deck_id, number, room_type, capacity], properties: {deck_id: {type: string, format: uuid}, number: {type: string}, room_type: {type: string, enum: [inside, oceanview, balcony, suite, crew, other]}, capacity: {type: integer, minimum: 1}, is_bookable: {type: boolean, default: true}, layout: {type: object, additionalProperties: true, nullable: true}}}
    RoomUpdate: {type: object, properties: {number: {type: string}, is_bookable: {type: boolean}, capacity: {type: integer, minimum: 1}, layout: {type: object, additionalProperties: true, nullable: true}}}
    Room: {type: object, properties: {id: {type: string, format: uuid}, ship_id: {type: string, format: uuid}, deck_id: {type: string, format: uuid}, number: {type: string}, room_type: {type: string}, capacity: {type: integer}, is_bookable: {type: boolean}}}
