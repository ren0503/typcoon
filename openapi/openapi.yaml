  /rooms/{id}:                  {get: {tags: [ship], summary: Get room, parameters: [{$ref: '#/components/parameters/Id'}], responses: {200: {$ref: '#/components/responses/Room'}, 404: {$ref: '#/components/responses/NotFound'}}}, patch: {tags: [ship], summary: Update room, parameters: [{$ref: '#/components/parameters/Id'}], requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/RoomUpdate'}}}}, responses: {200: {$ref: '#/components/responses/Room'}}}, delete: {tags: [ship], summary: Soft-delete room, parameters: [{$ref: '#/components/parameters/Id'}], responses: {204: {description: Deleted}}}}

