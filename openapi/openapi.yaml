    post: { tags: [ship], summary: Create ship, requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/ShipInput'}}}}, responses: {201: {$ref: '#/components/responses/Ship'}, 422: {$ref: '#/components/responses/ValidationError'}, 409: {$ref: '#/components/responses/Conflict'}} }
  /ships/{id}:
