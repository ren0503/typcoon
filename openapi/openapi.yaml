    VoyageInput: {type: object, required: [ship_id, code, departure_at, arrival_at], properties: {ship_id: {type: string, format: uuid}, code: {type: string}, departure_at: {type: string, format: date-time}, arrival_at: {type: string, format: date-time}, boarding_opens_at: {type: string, format: date-time, nullable: true}, manifest_frozen_at: {type: string, format: date-time, nullable: true}}}
