openapi: "3.0.3"
info:
  title: Yacht Management System — Business API (/v1)
  version: "0.1.0"
  description: |
    Initial business-layer API foundation for feature `002-business-modules`.

    Conventions (binding unless overridden per endpoint):
      * All business endpoints are default-deny; requests must resolve an authenticated
        principal (Authorization header in production; dev principal provider only when
        auth.mode=dev and a non-production environment is configured).
      * Errors use the shared envelope: `{ error: { code, message, request_id } }`.
      * List endpoints use opaque cursor pagination: query params `limit` (default 20,
        max 100 — clamped) and `cursor`. Response meta carries `next_cursor: string|null`.
      * A malformed cursor, a cursor issued for another filter set, or a cursor past the
        result end returns 400 with code `invalid_cursor`.
      * Write endpoints whose underlying tables define idempotency columns (bookings,
        service_bookings) accept an `Idempotency-Key` header. Repeating the same key with
        the same payload returns the original result; the same key with a different
        payload returns 409 `idempotency_conflict`.
      * Soft-deleted parents referenced by create/update are rejected uniformly with
        422 violations (code `invalid_reference` / `not_found`).
      * Sensitive fields (guest documents, emergency contacts, token/PIN hashes) are
        never present in responses.
paths:
  /tenants:
    get: &list-generic     { tags: [tenant], summary: List tenants, parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}], responses: {200: {$ref: '#/components/responses/TenantPage'}, 400: {$ref: '#/components/responses/BadRequest'}, 401: {$ref: '#/components/responses/Unauthorized'}} }
