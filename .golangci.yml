version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
    - revive
    - gocritic
    - misspell
    - prealloc
    - unparam
    - funcorder
    - nolintlint
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    depguard:
      rules:
        no-app-or-cmd-imports-from-modules:
          files:
            - "$all"
            - "!**/cmd/**"
            - "!**/internal/app/**"
            - "!**/internal/transport/http/**"
            - "!**/internal/platform/testutil/**"
          deny:
            - pkg: "github.com/ren0503/tycoon/internal/app$"
              desc: business modules must not import the composition root
            - pkg: "github.com/ren0503/tycoon/cmd$"
              desc: business modules must not import command packages
    staticcheck:
      checks:
        - all
        - -S1016
        - -ST1000

formatters:
  enable:
    - gofmt
    - goimports
