version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        no-app-or-cmd-imports-from-modules:
          files:
            - "$all"
            - "!**/cmd/**"
            - "!**/internal/app/**"
            - "!**/internal/httpserver/**"
            - "!**/internal/testutil/**"
          deny:
            - pkg: "github.com/ren0503/tycoon/internal/app$"
              desc: business modules must not import the composition root
            - pkg: "github.com/ren0503/tycoon/cmd$"
              desc: business modules must not import command packages
    staticcheck:
      checks:
        - all
        - -S1016
        - -ST1000
